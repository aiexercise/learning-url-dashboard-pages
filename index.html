<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>URL Digest</title>
    <link rel="stylesheet" href="./styles.css?v=20260518-mobile2" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="워크스페이스 탐색">
        <div class="brand">
          <span class="brand-mark">UD</span>
          <div>
            <strong>URL Digest</strong>
            <span>Hermes Cron Inbox</span>
          </div>
        </div>

        <nav class="nav-list" aria-label="기본 메뉴">
          <a class="nav-item active" href="#">
            <span class="icon" aria-hidden="true">◇</span>
            Inbox
            <span class="count" id="navInboxCount">0</span>
          </a>
          <a class="nav-item" href="#saved">
            <span class="icon" aria-hidden="true">□</span>
            Saved
            <span class="count" id="navSavedCount">0</span>
          </a>
          <a class="nav-item" href="#failed">
            <span class="icon" aria-hidden="true">○</span>
            Retry
            <span class="count" id="navFailedCount">0</span>
          </a>
        </nav>

        <section class="source-panel" aria-label="수집 소스">
          <div class="panel-title">Sources</div>
          <button class="source-row selected" type="button" data-side-source="all">
            <span class="source-dot"></span>
            All
            <span data-source-count="all">0</span>
          </button>
          <button class="source-row" type="button" data-side-source="youtube">
            <span class="source-dot youtube"></span>
            YouTube
            <span data-source-count="youtube">0</span>
          </button>
          <button class="source-row" type="button" data-side-source="threads">
            <span class="source-dot threads"></span>
            Threads
            <span data-source-count="threads">0</span>
          </button>
          <button class="source-row" type="button" data-side-source="web">
            <span class="source-dot web"></span>
            Web
            <span data-source-count="web">0</span>
          </button>
        </section>

        <div class="sync-card">
          <span>Data source</span>
          <strong>data/digests.json</strong>
          <small>Hermes cron이 JSON을 갱신하면 새로고침으로 목록에 반영됩니다. 수동 추가분은 이 브라우저 localStorage에 저장됩니다.</small>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div class="topbar-actions">
            <button class="icon-button" id="refreshButton" type="button" aria-label="새로고침" title="새로고침">↻</button>
            <button class="primary-button" id="toggleAddForm" type="button" aria-expanded="false" aria-controls="addPanel">URL 추가</button>
          </div>
        </header>

        <section class="metrics" aria-label="요약 현황">
          <article class="metric">
            <span>전체 링크</span>
            <strong id="metricTotal">0</strong>
            <small>JSON + 수동 추가</small>
          </article>
          <article class="metric">
            <span>읽지 않음</span>
            <strong id="metricUnread">0</strong>
            <small>검토 대기</small>
          </article>
          <article class="metric">
            <span>저장됨</span>
            <strong id="metricSaved">0</strong>
            <small>다시 볼 항목</small>
          </article>
          <article class="metric">
            <span>실패한 URL</span>
            <strong id="metricFailed">0</strong>
            <small>재시도 필요</small>
          </article>
        </section>

        <section class="workspace">
          <div class="toolbar" aria-label="리스트 제어">
            <label class="search">
              <span aria-hidden="true">⌕</span>
              <input id="searchInput" type="search" placeholder="제목, 요약, 적용요소, 태그 검색" />
            </label>
          </div>

          <form class="add-panel" id="addPanel" hidden>
            <div>
              <label for="urlInput">원문 URL</label>
              <input id="urlInput" name="url" type="url" placeholder="https://..." required />
            </div>
            <div>
              <label for="titleInput">제목</label>
              <input id="titleInput" name="title" type="text" placeholder="비워두면 도메인으로 저장" />
            </div>
            <div class="wide">
              <label for="summaryInput">개요 / 요약</label>
              <textarea id="summaryInput" name="summary" rows="3" placeholder="Hermes가 요약한 핵심 내용 또는 임시 메모"></textarea>
            </div>
            <div class="wide">
              <label for="applicationInput">적용요소</label>
              <textarea id="applicationInput" name="application" rows="2" placeholder="상현님 시스템에 적용할 점 / 보류 이유"></textarea>
            </div>
            <div>
              <label for="tagsInput">태그</label>
              <input id="tagsInput" name="tags" type="text" placeholder="agent, youtube, idea" />
            </div>
            <button class="primary-button" type="submit">저장</button>
            <p class="form-note" id="formNote" role="status"></p>
          </form>

          <div class="content-layout">
            <section class="digest-list" id="digestList" aria-label="URL 요약 목록"></section>

            <aside class="detail-panel" aria-label="선택된 요약 상세">
              <div class="detail-body" id="detailBody">
                <p class="empty-detail">왼쪽 목록에서 링크를 선택하세요.</p>
              </div>
            </aside>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="./app.js?v=20260518-mobile2"></script>
  </body>
</html>
